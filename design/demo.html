<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutor character demo</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #ece9e3; color: #24232a; }
  .stage { position: relative; height: 100vh; background: radial-gradient(ellipse at 50% 30%, #fffdf9 0%, #f4f0e9 50%, #e8e2d7 100%); overflow: hidden; }
  .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(180deg, rgba(228,221,209,0), rgba(226,218,205,0.85)); }
  tutor-3d { position: absolute; inset: 0; }
  .bar { position: absolute; left: 20px; bottom: 20px; display: flex; flex-wrap: wrap; gap: 6px; }
  button { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid #e0dbd2; background: #fbfaf7; font: inherit; font-weight: 600; cursor: pointer; }
  button.on { background: #1f8a92; color: #fff; border-color: transparent; }
</style>
</head>
<body>
  <div class="stage">
    <div class="floor"></div>
    <tutor-3d id="t" pose="explain" speaking="on" roam="0.8" size="1.3" rleft="0.05" rright="0.95"></tutor-3d>
    <div class="bar" id="bar"></div>
  </div>
  <script src="./tutor-3d.js"></script>
  <script>
    const t = document.getElementById('t'), bar = document.getElementById('bar');
    const poses = ['explain', 'point', 'celebrate', 'wave', 'think', 'listen', 'shrug'];
    poses.forEach(p => {
      const b = document.createElement('button'); b.textContent = p; b.dataset.pose = p;
      b.onclick = () => { t.setAttribute('pose', p); render(); };
      bar.appendChild(b);
    });
    const sp = document.createElement('button'); sp.onclick = () => { t.setAttribute('speaking', t.getAttribute('speaking') === 'on' ? 'off' : 'on'); render(); }; bar.appendChild(sp);
    function render() {
      bar.querySelectorAll('[data-pose]').forEach(b => b.classList.toggle('on', b.dataset.pose === t.getAttribute('pose')));
      sp.textContent = t.getAttribute('speaking') === 'on' ? 'talking' : 'silent';
    }
    render();
  </script>
</body>
</html>
