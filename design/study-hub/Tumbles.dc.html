<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tumble set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f8f7f4}
/* each loop: entrance, the tumble, the get-up, a rest; opacity hides the jump back */
@keyframes tRoll{0%{transform:translate(-70px,0) rotate(0);opacity:0}5%{opacity:1}18%{transform:translate(-34px,-62px) rotate(260deg)}32%{transform:translate(8px,-18px) rotate(520deg)}40%{transform:translate(26px,0) rotate(720deg) scale(1.28,0.72)}48%{transform:translate(30px,0) rotate(720deg) scale(0.9,1.1)}56%{transform:translate(30px,0) rotate(726deg)}62%,90%{transform:translate(30px,0) rotate(720deg);opacity:1}100%{transform:translate(30px,0) rotate(720deg);opacity:0}}
@keyframes tSplat{0%{transform:translateY(-110px);opacity:0}6%{opacity:1}24%{transform:translateY(0) scale(0.92,1.1)}30%{transform:translateY(0) scale(1.7,0.28)}52%{transform:translateY(0) scale(1.7,0.28)}60%{transform:translateY(-14px) scale(0.82,1.22)}70%{transform:translateY(0) scale(1.08,0.94)}78%,92%{transform:none;opacity:1}100%{transform:none;opacity:0}}
@keyframes tBonk{0%{transform:translateX(-56px);opacity:0}6%{opacity:1}26%{transform:translateX(34px) scale(1,1)}30%{transform:translateX(40px) scale(0.62,1.16)}46%{transform:translateX(-24px) translateY(-36px) rotate(-220deg)}60%{transform:translateX(-40px) translateY(0) rotate(-360deg) scale(1.2,0.8)}68%{transform:translateX(-40px) rotate(-360deg) scale(0.94,1.06)}76%,92%{transform:translateX(-40px) rotate(-360deg);opacity:1}100%{transform:translateX(-40px) rotate(-360deg);opacity:0}}
@keyframes tDizzy{0%,100%{transform:rotate(0)}12%{transform:rotate(-14deg) translateX(-6px)}25%{transform:rotate(12deg) translateX(6px)}38%{transform:rotate(-10deg)}50%{transform:rotate(9deg)}62%{transform:rotate(-6deg)}75%{transform:rotate(4deg)}88%{transform:rotate(0)}}
@keyframes tKnock{0%,22%{transform:none}30%{transform:translateX(26px) rotate(30deg)}42%{transform:translateX(52px) translateY(0) rotate(88deg) scale(1.08,0.92)}48%{transform:translateX(56px) rotate(80deg)}54%{transform:translateX(56px) rotate(92deg)}60%{transform:translateX(56px) rotate(84deg)}74%{transform:translateX(40px) translateY(-20px) rotate(-20deg)}84%{transform:translateX(34px) scale(1.08,0.92)}90%,100%{transform:translateX(34px)}}
@keyframes tSlam{0%,18%{transform:none}26%{transform:translate(-30px,-70px) rotate(-150deg)}40%{transform:translate(-62px,-56px) rotate(-400deg)}52%{transform:translate(-74px,0) rotate(-540deg) scale(1.2,0.8)}58%{transform:translate(-78px,0) rotate(-630deg)}70%{transform:translate(-78px,0) rotate(-630deg)}82%{transform:translate(-70px,-16px) rotate(-700deg)}92%,100%{transform:translate(-68px,0) rotate(-720deg)}}
@keyframes ball{0%{transform:translateX(-120px);opacity:0}8%{opacity:1}26%{transform:translateX(-6px)}40%{transform:translateX(-60px) translateY(-40px);opacity:1}55%,100%{transform:translateX(-90px) translateY(10px);opacity:0}}
@keyframes wave{0%,14%{transform:translate(-50%,-50%) scale(0);opacity:0}20%{opacity:0.9}40%{transform:translate(-50%,-50%) scale(1.6);opacity:0}100%{opacity:0}}
@keyframes orbit{from{transform:translateX(-50%) rotate(0)}to{transform:translateX(-50%) rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*{animation-play-state:paused !important}}
</style>
</helmet>
<div style="min-height: 100vh; box-sizing: border-box; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; font-family: 'Figtree', system-ui, sans-serif; color: #1d1b24; background: radial-gradient(50% 80% at 0% 100%, #d7e5ff 0%, rgba(215,229,255,0) 100%), radial-gradient(50% 80% at 100% 0%, #ffe6d6 0%, rgba(255,230,214,0) 100%), #f8f7f4">
  <div style="display: flex; align-items: baseline; gap: 14px">
    <h2 style="margin: 0; font-size: 24px; font-weight: 800">Tumble set: he falls over differently depending on what hit him</h2>
    <span style="font-size: 14px; color: #4a4756">New Blender clips, all ending in <b>recover</b>. Feet stay on; he never leaves the stage.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{ cells }}" as="c" hint-placeholder-count="6">
      <article style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 20px; background: #ffffff; box-shadow: 0 0 0 1px rgba(29,27,36,0.05), 0 16px 30px -24px rgba(61,90,214,0.6)">
        <div style="position: relative; height: 190px; border-radius: 14px; overflow: hidden; background: linear-gradient(180deg,#f3f1fb 0%,#ffffff 70%)">
          <span aria-hidden="true" style="position: absolute; left: 10%; right: 10%; bottom: 22px; height: 10px; border-radius: 50%; background: linear-gradient(90deg,#4285f4,#ea4335,#fbbc04,#34a853); opacity: 0.55"></span>
          <span aria-hidden="true" style="{{ c.propStyle }}"></span>
          <span aria-hidden="true" style="{{ c.waveStyle }}"></span>
          <div style="position: absolute; left: 50%; bottom: 26px; width: 84px; margin-left: -42px">
            <div style="{{ c.anim }}">
              <svg viewBox="0 0 120 130" style="display: block; width: 100%; overflow: visible" aria-label="{{ c.alt }}">
                <ellipse cx="40" cy="124" rx="15" ry="6" fill="#ff6b5b"></ellipse><ellipse cx="40" cy="120" rx="13" ry="6.5" fill="#efeef4"></ellipse>
                <ellipse cx="80" cy="124" rx="15" ry="6" fill="#ff6b5b"></ellipse><ellipse cx="80" cy="120" rx="13" ry="6.5" fill="#efeef4"></ellipse>
                <circle cx="60" cy="72" r="47" fill="#f6f5f9" stroke="#e4e2ec" stroke-width="2"></circle>
                <ellipse cx="12" cy="76" rx="12" ry="14" fill="#f6f5f9" stroke="#e4e2ec" stroke-width="2"></ellipse>
                <ellipse cx="108" cy="90" rx="11" ry="10" fill="#f6f5f9" stroke="#e4e2ec" stroke-width="2"></ellipse>
                <path d="M20 46 C 20 8, 102 6, 104 50 C 84 41, 40 40, 20 46 Z" fill="#ffffff" stroke="#e4e2ec" stroke-width="2"></path>
                <path d="M15 50 C 36 35, 86 34, 107 52 L 104 58 C 85 45, 38 45, 18 57 Z" fill="#4285f4"></path>
                <path d="M15 50 C 36 35, 86 34, 107 52 L 104 58 C 85 45, 38 45, 18 57 Z" fill="url(#tb-brim)"></path>
                <defs><linearGradient id="tb-brim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4285f4"></stop><stop offset="0.34" stop-color="#ea4335"></stop><stop offset="0.66" stop-color="#fbbc04"></stop><stop offset="1" stop-color="#34a853"></stop></linearGradient></defs>
                <path d="M0 -1 Q0.16 -0.16 1 0 Q0.16 0.16 0 1 Q-0.16 0.16 -1 0 Q-0.16 -0.16 0 -1 Z" transform="translate(56 27) scale(10)" fill="#7c5cf2"></path>
                <path d="{{ c.eyeL }}" stroke="#141318" stroke-width="5" stroke-linecap="round" fill="none"></path>
                <path d="{{ c.eyeR }}" stroke="#141318" stroke-width="5" stroke-linecap="round" fill="none"></path>
                <ellipse cx="34" cy="86" rx="7" ry="4" fill="#ffb3bd" opacity="0.8"></ellipse><ellipse cx="86" cy="87" rx="7" ry="4" fill="#ffb3bd" opacity="0.8"></ellipse>
                <path d="{{ c.mouth }}" fill="#4a2328"></path>
              </svg>
            </div>
            <span aria-hidden="true" style="{{ c.starStyle }}">
              <svg viewBox="0 0 24 24" style="position: absolute; left: 0; top: 6px; width: 14px"><path d="M12 0Q13.9 10.1 24 12Q13.9 13.9 12 24Q10.1 13.9 0 12Q10.1 10.1 12 0Z" fill="#fbbc04"></path></svg>
              <svg viewBox="0 0 24 24" style="position: absolute; right: 0; top: 6px; width: 12px"><path d="M12 0Q13.9 10.1 24 12Q13.9 13.9 12 24Q10.1 13.9 0 12Q10.1 10.1 12 0Z" fill="#4285f4"></path></svg>
              <svg viewBox="0 0 24 24" style="position: absolute; left: 34px; top: 0; width: 10px"><path d="M12 0Q13.9 10.1 24 12Q13.9 13.9 12 24Q10.1 13.9 0 12Q10.1 10.1 12 0Z" fill="#ea4335"></path></svg>
            </span>
          </div>
        </div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #3d5ad6">{{ c.clip }}</span>
        <span style="font-size: 15px; font-weight: 800; line-height: 1.25">{{ c.trigger }}</span>
        <span style="font-size: 12.5px; line-height: 1.4; color: #4a4756">{{ c.detail }}</span>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const OPEN = { eyeL: 'M44 70 L44 78', eyeR: 'M76 70 L76 78', mouth: 'M52 90 Q60 92 68 90 Q67 100 60 101 Q53 100 52 90 Z' };
    const DAZED = { eyeL: 'M39 70 L49 78 M49 70 L39 78', eyeR: 'M71 70 L81 78 M81 70 L71 78', mouth: 'M50 96 Q55 90 60 96 Q65 102 70 96' };
    const SQUINT = { eyeL: 'M38 74 Q44 69 50 74', eyeR: 'M70 74 Q76 69 82 74', mouth: 'M50 92 Q60 100 70 92 Q60 96 50 92 Z' };
    const none = 'display: none';
    const cells = [
      { clip: 'tumble_roll', trigger: 'Flung hard', detail: 'Released faster than about 4 m/s: rolls end over end, lands squashed, sits up.', face: OPEN, anim: 'tRoll 2.8s cubic-bezier(0.3,0.6,0.4,1) infinite', origin: '50% 60%' },
      { clip: 'splat', trigger: 'Dropped from high', detail: 'Fell more than about 1.2 m: flattens like dough, then pops back up.', face: SQUINT, anim: 'tSplat 2.6s ease-in infinite', origin: '50% 100%' },
      { clip: 'bonk', trigger: 'Hits a window or the edge', detail: 'Side hit on a window or the stage edge: squishes on contact, spins back.', face: DAZED, anim: 'tBonk 2.8s cubic-bezier(0.3,0.6,0.4,1) infinite', origin: '50% 60%', prop: 'position: absolute; right: 22px; top: 30px; bottom: 26px; width: 10px; border-radius: 6px; background: #d6dcf5; box-shadow: inset 0 0 0 2px #b9c2ea' },
      { clip: 'dizzy', trigger: 'Poked 3 times quickly', detail: 'Three pokes within 1.5 s: wobbles with stars circling, then shakes it off.', face: DAZED, anim: 'tDizzy 1.6s ease-in-out infinite', origin: '50% 100%', stars: true },
      { clip: 'knockback', trigger: 'Hit by the ball', detail: 'Ball contact above about 3 m/s: knocked onto his back, feet kick, rolls up.', face: SQUINT, anim: 'tKnock 2.8s ease-out infinite', origin: '50% 100%', prop: 'position: absolute; left: 50%; bottom: 70px; width: 26px; height: 26px; margin-left: -60px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff9a8c, #ff6b5b); animation: ball 2.8s ease-out infinite' },
      { clip: 'knockdown', trigger: 'Boss hit (wrong answer)', detail: 'The boss slams him: cartwheels back, face-plants, gets up determined.', face: DAZED, anim: 'tSlam 3s cubic-bezier(0.3,0.6,0.4,1) infinite', origin: '50% 60%', wave: true },
    ];
    return {
      cells: cells.map((c) => ({
        clip: c.clip, trigger: c.trigger, detail: c.detail,
        alt: 'Gemini Guy: ' + c.clip,
        eyeL: c.face.eyeL, eyeR: c.face.eyeR, mouth: c.face.mouth,
        anim: 'transform-origin: ' + c.origin + '; animation: ' + c.anim,
        propStyle: c.prop || none,
        waveStyle: c.wave ? 'position: absolute; left: 70%; top: 52%; width: 90px; height: 90px; border-radius: 50%; border: 6px solid #7a6a98; animation: wave 3s ease-out infinite' : none,
        starStyle: c.stars ? 'position: absolute; left: 50%; top: -10px; width: 60px; height: 24px; animation: orbit 0.9s linear infinite' : none,
      })),
    };
  }
}
</script>
</body>
</html>
