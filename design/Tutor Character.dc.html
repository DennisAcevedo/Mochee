<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ece9e3;font-family:'Figtree',system-ui,sans-serif;color:#24232a;-webkit-font-smoothing:antialiased}
a{color:oklch(0.45 0.09 205)}a:hover{color:oklch(0.38 0.09 205)}
*{box-sizing:border-box}
</style>
</helmet>
<div style="max-width:1400px;margin:0 auto;padding:32px 24px 56px;display:flex;flex-direction:column;gap:28px;">
  <div style="display:flex;flex-direction:column;gap:6px;">
    <div style="display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;">
      <div style="width:10px;height:10px;border-radius:50%;background:oklch(0.62 0.11 198);box-shadow:0 0 0 4px oklch(0.9 0.05 195);"></div>
      Tutor
    </div>
    <div style="font-size:30px;font-weight:700;letter-spacing:-0.02em;">Character &amp; animations</div>
    <div style="font-size:15px;color:#6c6861;">Pick a state to preview it large. Move your cursor and he follows it.</div>
  </div>

  <div data-screen-label="Preview" style="position:relative;height:560px;border-radius:28px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%, #fffdf9 0%, #f4f0e9 50%, #e8e2d7 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,0.7);">
    <div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg, rgba(228,221,209,0), rgba(226,218,205,0.85));"></div>
    <x-import component-from-global-scope="tutor-3d" from="./tutor-3d.js" pose="{{ pose }}" speaking="{{ speakingStr }}" rleft="0.08" rright="0.92" roam="{{ roamStr }}" size="1.35" style="position:absolute;inset:0;" hint-size="100%,100%"></x-import>
    <div style="position:absolute;left:20px;right:20px;bottom:20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:rgba(251,250,247,0.92);backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 8px 24px -12px rgba(70,50,25,0.3);">
        <sc-for list="{{ poses }}" as="p" hint-placeholder-count="8">
          <button onClick="{{ p.onClick }}" style="{{ p.style }}">{{ p.label }}</button>
        </sc-for>
      </div>
      <div style="display:flex;gap:8px;">
        <button onClick="{{ toggleSpeak }}" style="{{ speakStyle }}">{{ speakLabel }}</button>
        <button onClick="{{ toggleRoam }}" style="{{ roamBtnStyle }}">{{ roamLabel }}</button>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;">
    <div style="font-size:20px;font-weight:700;letter-spacing:-0.01em;">All states</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:14px;">
      <sc-for list="{{ cards }}" as="c" hint-placeholder-count="8">
        <div style="position:relative;height:320px;border-radius:24px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%, #fffdf9 0%, #f4f0e9 55%, #e8e2d7 100%);">
          <div style="position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg, rgba(228,221,209,0), rgba(226,218,205,0.85));"></div>
          <x-import component-from-global-scope="tutor-3d" from="./tutor-3d.js" pose="{{ c.id }}" speaking="{{ c.speak }}" rleft="0.1" rright="0.9" roam="0.15" size="1.1" style="position:absolute;inset:0;" hint-size="100%,100%"></x-import>
          <div style="position:absolute;left:18px;right:18px;bottom:14px;display:flex;flex-direction:column;gap:2px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8a857d;">{{ c.num }}</div>
              <div style="font-size:15px;font-weight:600;">{{ c.label }}</div>
              <sc-if value="{{ c.isNew }}" hint-placeholder-val="{{ false }}">
                <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:oklch(0.42 0.09 205);background:oklch(0.95 0.03 195);border-radius:6px;padding:2px 6px;">New</div>
              </sc-if>
            </div>
            <div style="font-size:13px;color:#6c6861;">{{ c.use }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pose: 'wave', speaking: false, roam: true };
  renderVals() {
    const { pose, speaking, roam } = this.state;
    const A = 'oklch(0.52 0.1 202)';
    const list = [
      { id: 'explain', label: 'Explaining', use: 'Default while teaching', speak: 'on' },
      { id: 'point', label: 'Pointing', use: 'Calls attention to the board', speak: 'on' },
      { id: 'celebrate', label: 'Celebrating', use: 'Correct quiz answer', speak: 'off' },
      { id: 'wave', label: 'Waving', use: 'Greeting at session start', speak: 'off', isNew: true },
      { id: 'think', label: 'Thinking', use: 'While generating an answer', speak: 'off', isNew: true },
      { id: 'listen', label: 'Listening', use: 'Mic is on, student speaking', speak: 'off', isNew: true },
      { id: 'shrug', label: 'Shrugging', use: 'Wrong answer, gentle retry', speak: 'on', isNew: true },
    ];
    return {
      pose, speakingStr: speaking ? 'on' : 'off', roamStr: roam ? '0.8' : '0.1',
      poses: list.map(p => ({ label: p.label, onClick: () => this.setState({ pose: p.id }), style: { height: 36, padding: '0 14px', border: 'none', borderRadius: 10, font: 'inherit', fontSize: 14, fontWeight: 600, cursor: 'pointer', background: p.id === pose ? A : 'transparent', color: p.id === pose ? '#fff' : '#4a4740' } })),
      cards: list.map((c, i) => ({ ...c, num: String(i + 1).padStart(2, '0'), isNew: !!c.isNew })),
      toggleSpeak: () => this.setState(s => ({ speaking: !s.speaking })),
      speakLabel: speaking ? 'Talking' : 'Silent',
      toggleRoam: () => this.setState(s => ({ roam: !s.roam })),
      roamLabel: roam ? 'Roaming' : 'Still',
      speakStyle: { height: 44, padding: '0 16px', borderRadius: 12, border: '1px solid #e0dbd2', background: speaking ? 'oklch(0.95 0.03 195)' : 'rgba(251,250,247,0.92)', color: speaking ? 'oklch(0.38 0.09 205)' : '#24232a', font: 'inherit', fontSize: 14, fontWeight: 600, cursor: 'pointer' },
      roamBtnStyle: { height: 44, padding: '0 16px', borderRadius: 12, border: '1px solid #e0dbd2', background: roam ? 'oklch(0.95 0.03 195)' : 'rgba(251,250,247,0.92)', color: roam ? 'oklch(0.38 0.09 205)' : '#24232a', font: 'inherit', fontSize: 14, fontWeight: 600, cursor: 'pointer' },
    };
  }
}
</script>
</body>
</html>
